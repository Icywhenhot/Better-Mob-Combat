plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.version
group = project.group

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven { url = 'https://maven.blamejared.com' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup "curse.maven" }
    }
    flatDir { dirs 'lib' }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Core dependencies from local lib/ (Modrinth's maven POM endpoint and some maven hosts are unreliable
    // in this environment; the jars are pulled straight from the reliable Modrinth CDN into lib/). All are
    // NeoForge-loadable mod jars.
    implementation files('lib/bettercombat-neoforge-2.0.4+1.21.1.jar')
    implementation files('lib/player-animation-lib-forge-2.0.4+1.21.1.jar')
    implementation files('lib/cloth-config-15.0.140-neoforge.jar')

    // Mob Player Animator: the author's client-side companion mod that makes mobs implement Player Animator's
    // IAnimatedPlayer (getAnimationStack). Required on the client for mob attack animations (declared side=CLIENT
    // in neoforge.mods.toml). It loads as a mod on every dev run via runtimeOnly, which makes `runClient` work
    // out of the box. NOTE: this unofficial NeoForge build is not server-safe (its @Mod touches client classes),
    // so it crashes `runServer`; comment this line out when testing the dedicated server (a real server never
    // ships this client-only mod, and the server was verified to run fine without it).
    runtimeOnly files('lib/mobplayeranimator-neoforge-1.21.1-1.4.0.jar')

    // MixinExtras is bundled by NeoForge (mixinextras-neoforge is on the compile classpath transitively).

    // GeckoLib compat: compile-time only (optional runtime mod)
    compileOnly files('lib/geckolib-neoforge-1.21.1-4.9.2.jar')

    // Third-party compat (optional at runtime for end users; our @Pseudo mixins apply only when the mod is present).
    // Guard Villagers is hard-referenced by its mixin so it is needed at compile time, but is kept compileOnly:
    // loading it in the dev client alongside Mob Player Animator triggers a crash inside Mob Player Animator's own
    // (unrelated) Guard Villagers model-compat mixin, which doesn't match Guard Villagers 2.4.10. Our server-side
    // Guard mixin was verified separately via runServer. MCA's mixin is @Pseudo (no imports) and MCA is self-contained.
    compileOnly files('lib/guardvillagers-2.4.10-1.21.1.jar')
    runtimeOnly files('lib/mca-neoforge-7.7.22+1.21.1.jar')

    compileOnly "org.jetbrains:annotations:24.1.0"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Expand tokens in mod metadata
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version            : minecraft_version,
            minecraft_version_range      : minecraft_version_range,
            neo_version_range            : neo_version_range,
            loader_version_range         : loader_version_range,
            mod_id                       : mod_id,
            mod_name                     : mod_name,
            mod_license                  : mod_license,
            mod_version                  : version,
            mod_author                   : mod_author,
            mod_description              : mod_description,
            mod_credits                  : mod_credits,
            better_combat_version_range  : better_combat_version_range,
            player_anim_version_range    : player_anim_version_range,
            mob_player_anim_version_range: mob_player_anim_version_range,
            cloth_config_version_range   : cloth_config_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${System.getenv("local_maven") ?: layout.buildDirectory.dir('repo').get().asFile}"
        }
    }
}
